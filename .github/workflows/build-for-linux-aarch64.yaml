name: Build for Android arm64

on:
  push:
    branches: [ "main", "aarch64-linux", "aarch64", "arm64" ]
  pull_request:
    branches: [ "main", "aarch64-linux", "aarch64", "arm64" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y aria2 zip cmake build-essential

      - name: Set up Android NDK r23b
        run: |
          aria2c -o android-ndk-r23b-linux.zip https://dl.google.com/android/repository/android-ndk-r23b-linux.zip
          unzip -q android-ndk-r23b-linux.zip

      - name: Build
        run: |
          mkdir build
          cd build
          # Use the official NDK toolchain configuration to force build for Android ARM64
          cmake -DCMAKE_TOOLCHAIN_FILE=$GITHUB_WORKSPACE/android-ndk-r23b/build/cmake/android.toolchain.cmake \
                -DANDROID_ABI=arm64-v8a \
                -DANDROID_PLATFORM=android-22 \
                ..
          make -j$(nproc)

      - name: Set outputs
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Create Release Zip File
        run: |
          zip -r Wrapper.arm64.latest.zip rootfs/ wrapper wrapper-rootless compose.yaml entrypoint.sh Dockerfile

      - name: Update Tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f wrapper.arm64.latest
          git push origin wrapper.arm64.latest --force

      - name: Create or Update Release
        uses: softprops/action-gh-release@v2
        with:
          files: Wrapper.arm64.latest.zip
          body: |
            Latest Android arm64 build.
            Commit: ${{ github.sha }}
            Message: ${{ github.event.head_commit.message }}
          name: Wrapper.arm64.latest
          tag_name: wrapper.arm64.latest
          make_latest: true
          overwrite: true
          
