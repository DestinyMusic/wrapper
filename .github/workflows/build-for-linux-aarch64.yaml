name: Build for Linux aarch64

on:
  push:
    branches: [ "main", "aarch64-linux", "aarch64", "arm64" ]
  pull_request:
    branches: [ "main", "aarch64-linux", "aarch64", "arm64" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt update
          # Added the Linux ARM64 compiler below
          sudo apt install -y aria2 zip cmake build-essential gcc-aarch64-linux-gnu

      - name: Set up Android NDK r23b
        run: |
          aria2c -o android-ndk-r23b-linux.zip https://dl.google.com/android/repository/android-ndk-r23b-linux.zip
          unzip -q android-ndk-r23b-linux.zip

      - name: Build
        run: |
          mkdir build
          cd build
          
          # 1. Build the Android components using the NDK
          cmake -DCMAKE_TOOLCHAIN_FILE=$GITHUB_WORKSPACE/android-ndk-r23b/build/cmake/android.toolchain.cmake \
                -DANDROID_ABI=arm64-v8a \
                -DANDROID_PLATFORM=android-22 \
                ..
          make -j$(nproc)
          
          # 2. Go back to the main directory
          cd ..
          
          # 3. OVERWRITE the broken Intel host wrappers with pure Linux ARM64 versions
          aarch64-linux-gnu-gcc -O3 -Wall -o wrapper wrapper.c cmdline.c
          aarch64-linux-gnu-gcc -O3 -Wall -o wrapper-rootless wrapper-rootless.c cmdline.c

      - name: Set outputs
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Create Release Zip File
        run: |
          zip -r wrapper.aarch64.linux.zip rootfs/ wrapper wrapper-rootless compose.yaml entrypoint.sh Dockerfile

      - name: Update Tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f wrapper.aarch64.linux.latest
          git push origin wrapper.aarch64.linux.latest --force

      - name: Create or Update Release
        uses: softprops/action-gh-release@v2
        with:
          files: wrapper.aarch64.linux.zip
          body: |
            Latest build packaged for aarch64 linux container.
            Commit: ${{ github.sha }}
            Message: ${{ github.event.head_commit.message }}
          name: Wrapper.aarch64.linux.latest
          tag_name: wrapper.aarch64.linux.latest
          make_latest: true
          overwrite: true
          
